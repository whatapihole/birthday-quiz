<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1b0b3a"><title>Join the Quiz 🎂</title>
<style>
:root {
  --bg1: #1b0b3a; --bg2: #3a0f5c; --bg3: #0d2a5c;
  --gold: #ffcc4d; --pink: #ff5fa2; --text: #fff; --muted: #c9bde6; --card: rgba(255,255,255,.08); --line: rgba(255,255,255,.15);
  --a: #e5484d; --b: #2f80ed; --c: #f2a900; --d: #27ae60;
  --ok: #2ecc71; --bad: #ff5c5c;
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; color: var(--text); }
body {
  background: radial-gradient(circle at 15% 10%, #6b1f8f 0%, transparent 40%), radial-gradient(circle at 90% 90%, #123f8a 0%, transparent 45%), linear-gradient(135deg, var(--bg1), var(--bg2) 50%, var(--bg3));
  background-attachment: fixed; min-height: 100vh;
}
button { font: inherit; cursor: pointer; border: 0; border-radius: 14px; padding: .7em 1.2em; font-weight: 700; color: #fff; background: var(--pink); transition: transform .08s, filter .15s; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:active { transform: scale(.97); }
button:hover { filter: brightness(1.08); }
button.secondary { background: var(--card); border: 1px solid var(--line); }
button.gold { background: var(--gold); color: #3a1a00; }
button:disabled { opacity: .45; cursor: not-allowed; }
input, select { font: inherit; padding: .6em .8em; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: #fff; }
select option { color: #000; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; backdrop-filter: blur(6px); }
.muted { color: var(--muted); }
.hidden { display: none !important; }
.center { text-align: center; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.title-glow { background: linear-gradient(90deg, var(--gold), #fff3c4, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 900; letter-spacing: -.5px; }
.pill { display: inline-block; padding: .25em .8em; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: .9em; }
.diff-easy { color: #7dffb0; } .diff-medium { color: #ffe27a; } .diff-hard { color: #ff8a8a; }
.optA { background: var(--a); } .optB { background: var(--b); } .optC { background: var(--c); } .optD { background: var(--d); }
.shape { display: inline-flex; width: 1.6em; justify-content: center; opacity: .9; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.overlay { position: fixed; inset: 0; background: rgba(10,0,30,.75); display: flex; align-items: center; justify-content: center; z-index: 40; text-align: center; padding: 20px; }
.overlay .big { font-size: 2.2em; font-weight: 900; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: rgba(0,0,0,.7); padding: .6em 1.2em; border-radius: 999px; z-index: 60; font-weight: 700; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pulse { 50% { transform: scale(1.06); } }
.pop { animation: pop .35s ease-out both; }
.rise { animation: rise .45s ease-out both; }

@keyframes unblur { from { filter: blur(45px) saturate(1.4); } to { filter: blur(0); } }

.host .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6vh 1.6vw; }

.kbd { display: inline-block; border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 6px; padding: 0 .4em; font-size: .85em; }

/* ================= PLAYER / PHONE ================= */
body.player { min-height: 100dvh; }
.player #app { max-width: 520px; margin: 0 auto; padding: 16px 16px 90px; min-height: 100dvh; display: flex; flex-direction: column; }
.player .hdr { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 10px; }

.player .ans { font-size: 18px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px; text-align: center; line-height: 1.2; }

.player .qsmall { font-size: 17px; font-weight: 700; line-height: 1.3; }
.player .ptimer { height: 8px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; margin-top: 10px; }

/* landing */
.landing { max-width: 560px; margin: 0 auto; padding: 40px 20px; text-align: center; }
.landing .card { margin-top: 20px; text-align: left; }

</style>

  // Free TURN relay from Metered (needed for phones on mobile data / strict networks).

/* ===== fx.js ===== */
/* Sounds (generated, no files), confetti, screen wake lock, small helpers */
(function () {
  let ctx = null, muted = localStorage.getItem("quizMuted") === "1";
  function ac() { if (!ctx) { try { ctx = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } if (ctx && ctx.state === "suspended") ctx.resume(); return ctx; }
  function tone(freq, dur, type, vol, when) {
    const c = ac(); if (!c || muted) return;
    const t = c.currentTime + (when || 0), o = c.createOscillator(), g = c.createGain();
    o.type = type || "sine"; o.frequency.setValueAtTime(freq, t);
    g.gain.setValueAtTime(0, t); g.gain.linearRampToValueAtTime(vol || .2, t + .01); g.gain.exponentialRampToValueAtTime(.0001, t + dur);
    o.connect(g).connect(c.destination); o.start(t); o.stop(t + dur + .05);
  }
  const S = {
    unlock: () => ac(),
    tick: () => tone(880, .08, "square", .06),
    tock: () => tone(660, .1, "square", .08),
    reveal: () => { tone(523, .15, "triangle", .2); tone(659, .15, "triangle", .2, .12); tone(784, .3, "triangle", .2, .24); },
    join: () => { tone(700, .08, "sine", .15); tone(1050, .12, "sine", .15, .07); },
    whoosh: () => { [300, 400, 520, 680].forEach((f, i) => tone(f, .18, "sawtooth", .05, i * .06)); },
    correct: () => { tone(660, .12, "triangle", .2); tone(990, .25, "triangle", .2, .1); },
    wrong: () => { tone(220, .3, "sawtooth", .12); },
    joker: () => { [523, 659, 784, 1047].forEach((f, i) => tone(f, .14, "square", .08, i * .07)); },
    fanfare: () => { [[523,0],[523,.15],[523,.3],[659,.45],[784,.75],[659,1.0],[784,1.15],[1047,1.4]].forEach(([f, w]) => tone(f, .35, "triangle", .2, w)); },
    get muted() { return muted; },
    toggleMute() { muted = !muted; localStorage.setItem("quizMuted", muted ? "1" : "0"); return muted; }
  };
  document.addEventListener("pointerdown", () => ac(), { once: true });

  function confetti(ms) {
    let cv = document.getElementById("confetti");
    if (!cv) { cv = document.createElement("canvas"); cv.id = "confetti"; document.body.appendChild(cv); }
    const x = cv.getContext("2d"); cv.width = innerWidth; cv.height = innerHeight;
    const cols = ["#ffcc4d", "#ff5fa2", "#2f80ed", "#27ae60", "#e5484d", "#fff"];
    const P = Array.from({ length: 220 }, () => ({ x: Math.random() * cv.width, y: -Math.random() * cv.height, r: 4 + Math.random() * 6, c: cols[Math.floor(Math.random() * cols.length)], vy: 2 + Math.random() * 4, vx: -2 + Math.random() * 4, a: Math.random() * 6, va: -.2 + Math.random() * .4 }));
    const end = performance.now() + (ms || 6000);
    (function f(now) {
      x.clearRect(0, 0, cv.width, cv.height);
      P.forEach((p) => { p.x += p.vx; p.y += p.vy; p.a += p.va; if (p.y > cv.height && now < end) { p.y = -10; p.x = Math.random() * cv.width; }
        x.save(); x.translate(p.x, p.y); x.rotate(p.a); x.fillStyle = p.c; x.fillRect(-p.r / 2, -p.r / 2, p.r, p.r * .6); x.restore(); });
      if (now < end + 3000) requestAnimationFrame(f); else x.clearRect(0, 0, cv.width, cv.height);
    })(performance.now());
  }

  let lock = null;
  async function keepAwake() {
    try { if ("wakeLock" in navigator && document.visibilityState === "visible") { lock = await navigator.wakeLock.request("screen"); } } catch (e) {}
  }
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible" && lock !== null) keepAwake(); });

  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const SHAPES = ["▲", "◆", "●", "■"], LETTERS = ["A", "B", "C", "D"];
  function toast(msg, ms) {
    const t = document.createElement("div"); t.className = "toast"; t.textContent = msg; document.body.appendChild(t);
    setTimeout(() => t.remove(), ms || 2500);
  }
  window.FX = { S, confetti, keepAwake, esc, SHAPES, LETTERS, toast };
})();

</script><script>
/* ===== transport.js ===== */
/* Connection layer. Two interchangeable transports:
   - "peer"  : PeerJS / WebRTC (real game, phones anywhere)
   - "local" : BroadcastChannel (testing with several tabs on ONE computer; add ?local=1 to URLs) */
(function () {
  const CFG = window.QUIZ_CONFIG || {};
  const isLocal = () => new URLSearchParams(location.search).get("local") === "1";

  async function getIceServers() {
    const list = (CFG.iceServers || []).slice();
    if (CFG.meteredCredentialsUrl) {
      try {
        const ctl = new AbortController();
        const t = setTimeout(() => ctl.abort(), 5000);
        const r = await fetch(CFG.meteredCredentialsUrl, { signal: ctl.signal });
        clearTimeout(t);
        const extra = await r.json();
        if (Array.isArray(extra)) list.push(...extra);
      } catch (e) { console.warn("TURN credentials fetch failed; continuing with STUN only", e); }
    }
    return list;
  }
  const hostPeerId = (room) => (CFG.peerPrefix || "quiz-") + room.toLowerCase();

  /* ---------------- HOST ---------------- */
  async function createHost(room, h) {
    if (isLocal()) {
      const bc = new BroadcastChannel("quiz-" + room);
      bc.onmessage = (e) => {
        const d = e.data; if (!d || d.to !== "host") return;
        if (d.kind === "open") h.onOpen(d.from);
        else if (d.kind === "close") h.onClose(d.from);
        else h.onMessage(d.from, d.msg);
      };
      setTimeout(() => h.onStatus("Local test mode (same computer only)", true), 0);
      return { send: (id, msg) => bc.postMessage({ to: id, msg }), close: () => bc.close() };
    }
    const iceServers = await getIceServers();
    const conns = {};
    let peer, destroyed = false, attempts = 0;
    function start() {
      peer = new Peer(hostPeerId(room), { config: { iceServers }, debug: 1 });
      peer.on("open", () => { attempts = 0; h.onStatus("Online — players can join", true); });
      peer.on("connection", (conn) => {
        const id = conn.connectionId;
        conn.on("open", () => { conns[id] = conn; h.onOpen(id); });
        conn.on("data", (msg) => h.onMessage(id, msg));
        conn.on("close", () => { delete conns[id]; h.onClose(id); });
        conn.on("error", () => { delete conns[id]; h.onClose(id); });
      });
      peer.on("disconnected", () => {
        if (destroyed) return;
        h.onStatus("Connection to broker lost — reconnecting…", false);
        setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 1500);
      });
      peer.on("error", (err) => {
        console.warn("peer error", err.type, err);
        if (err.type === "unavailable-id") {
          attempts++;
          h.onStatus("Room ID still held by previous session — retrying (" + attempts + ")…", false);
          try { peer.destroy(); } catch (e) {}
          setTimeout(start, 4000);
        } else if (["network", "server-error", "socket-error", "socket-closed"].includes(err.type)) {
          h.onStatus("Network problem (" + err.type + ") — retrying…", false);
          setTimeout(() => { try { peer.reconnect(); } catch (e) {} }, 3000);
        }
      });
    }
    start();
    return {
      send: (id, msg) => { const c = conns[id]; if (c && c.open) { try { c.send(msg); } catch (e) {} } },
      close: () => { destroyed = true; try { peer.destroy(); } catch (e) {} }
    };
  }

  /* ---------------- PLAYER ---------------- */
  async function createPlayer(room, h) {
    if (isLocal()) {
      const me = "L" + Math.random().toString(36).slice(2, 10);
      const bc = new BroadcastChannel("quiz-" + room);
      bc.onmessage = (e) => { const d = e.data; if (d && d.to === me) h.onMessage(d.msg); };
      const api = {
        send: (msg) => bc.postMessage({ to: "host", from: me, msg }),
        reconnect: () => { bc.postMessage({ to: "host", from: me, kind: "open" }); setTimeout(h.onOpen, 50); },
        close: () => bc.postMessage({ to: "host", from: me, kind: "close" })
      };
      window.addEventListener("beforeunload", api.close);
      api.reconnect();
      return api;
    }
    const iceServers = await getIceServers();
    let peer = null, conn = null, connecting = false;
    function cleanup() {
      const oc = conn, op = peer; conn = null; peer = null;   // detach first so old 'close' events are ignored
      try { oc && oc.close(); } catch (e) {}
      try { op && op.destroy(); } catch (e) {}
    }
    function connect() {
      if (connecting) return;
      connecting = true;
      cleanup();
      h.onStatus("Connecting…");
      peer = new Peer(undefined, { config: { iceServers }, debug: 1 });
      const giveUp = setTimeout(() => { connecting = false; h.onClose("timeout"); }, 15000);
      peer.on("open", () => {
        const c = peer.connect(hostPeerId(room), { reliable: true, serialization: "json" });
        conn = c;
        c.on("open", () => { clearTimeout(giveUp); connecting = false; h.onOpen(); });
        c.on("data", (m) => h.onMessage(m));
        c.on("close", () => { if (conn === c) { connecting = false; h.onClose("closed"); } });
        c.on("error", () => { if (conn === c) { connecting = false; h.onClose("error"); } });
      });
      peer.on("error", (err) => {
        clearTimeout(giveUp); connecting = false;
        h.onClose(err.type === "peer-unavailable" ? "noroom" : err.type);
      });
    }
    connect();
    return {
      send: (msg) => { if (conn && conn.open) { try { conn.send(msg); } catch (e) {} } },
      reconnect: connect,
      close: cleanup
    };
  }

  window.QuizTransport = { createHost, createPlayer, isLocal };
})();

</script><script>
/* ===== play.js ===== */
/* PLAYER / PHONE screen */
(function () {
  const { S, confetti, keepAwake, esc, SHAPES, toast } = window.FX;
  const $ = (s) => document.querySelector(s);
  const app = () => $("#app");
  const params = new URLSearchParams(location.search);
  let room = (params.get("room") || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
  const EMOJIS = ["🦁", "🐯", "🐼", "🐸", "🦊", "🐙", "🦄", "🐝", "🐢", "🦉", "🐬", "🦖", "🐧", "🐨", "🐵", "🌵", "🍕", "🍩", "🌶️", "⚡", "🎸", "🚀", "👑", "🎯"];
  const OPT = ["optA", "optB", "optC", "optD"];

  // In local test mode each tab is its own player (sessionStorage); on phones use localStorage
  const store = QuizTransport.isLocal() ? sessionStorage : localStorage;
  let pid = store.getItem("quizPid");
  if (!pid) { pid = "p" + Math.random().toString(36).slice(2, 12); store.setItem("quizPid", pid); }
  const profKey = () => "quizProfile-" + room;
  const profile = () => { try { return JSON.parse(store.getItem(profKey()) || "null"); } catch (e) { return null; } };

  let tr = null, view = null, lastMsg = 0, deadline = 0, phaseDeadline = 0, connected = false, lastKey = "", retryTimer = null, lastPhase = "";
  let pickedEmoji = EMOJIS[Math.floor(Math.random() * EMOJIS.length)];

  function overlay(text, sub) {
    let o = $("#ov");
    if (!text) { if (o) o.remove(); return; }
    if (!o) { o = document.createElement("div"); o.id = "ov"; o.className = "overlay"; document.body.appendChild(o); }
    o.innerHTML = `<div><div class="big">${text}</div><div class="muted" style="margin-top:10px">${sub || ""}</div></div>`;
  }
  async function start() {
    if (!room) return renderCodeEntry();
    overlay("📡 Connecting…", "Room " + esc(room));
    tr = await QuizTransport.createPlayer(room, {
      onOpen: () => { connected = true; lastMsg = Date.now(); hello(); },
      onMessage: onMsg,
      onClose: (why) => {
        connected = false;
        overlay(why === "noroom" ? "🔍 Looking for room " + esc(room) + "…" : "📡 Reconnecting…", why === "noroom" ? "Make sure the quiz screen is open. Retrying automatically." : "Hang tight — your score is safe.");
        clearTimeout(retryTimer); retryTimer = setTimeout(() => tr.reconnect(), why === "noroom" ? 4000 : 1500);
      },
      onStatus: () => {}
    });
    setInterval(() => {
      if (!connected) return;
      tr.send({ t: "ping" });
      if (Date.now() - lastMsg > 12000) { connected = false; overlay("📡 Reconnecting…", "Lost contact with the quiz screen."); tr.reconnect(); }
    }, 4000);
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState !== "visible") return;
      keepAwake();
      if (!connected || Date.now() - lastMsg > 6000) { overlay("📡 Reconnecting…"); tr.reconnect(); }
    });
  }
  function hello() { const p = profile() || {}; tr.send({ t: "hello", pid, name: p.name, emoji: p.emoji, team: p.team }); }
  function onMsg(m) {
    lastMsg = Date.now();
    if (!m) return;
    if (m.t === "pong") return;
    if (m.t === "kicked") { store.removeItem(profKey()); view = null; overlay(null); app().innerHTML = `<div class="state"><div class="em">👋</div><div class="big">You were removed by the host</div><button class="bigbtn" onclick="location.reload()">Join again</button></div>`; return; }
    if (m.t === "view") {
      overlay(null);
      view = m.v;
      if (view.phase === "question") deadline = Date.now() + (view.endsIn || 0);
      if (view.phaseLeft != null) phaseDeadline = Date.now() + view.phaseLeft;
      render();
    }
  }
  function send(m) { if (tr) tr.send(m); }

  function hdr() {
    const r = view && view.round;
    return `<div class="hdr"><span class="title-glow" style="font-weight:900">${esc(view ? view.title : "Quiz")}</span><span class="muted">${r ? `Round ${r.n}/${r.of}` : "Room " + esc(room)}</span></div>`;
  }
  function footer() {
    if (!view || !view.me || view.phase === "join") return "";
    const me = view.me;
    return `<div class="footer"><span>${esc(me.emoji)} ${esc(me.name)}${me.team && view.mode === "teams" ? ` <span class="muted">· ${esc(me.team)}</span>` : ""}</span><span>${me.rank ? `#${me.rank} · ` : ""}${(me.score || 0).toLocaleString()} pts</span></div>`;
  }
  function renderCodeEntry() {
    app().innerHTML = `<h1 class="title-glow">🎂 Join the quiz</h1><div class="card"><label>Room code (on the TV)</label>
      <input class="big" id="code" maxlength="6" autocapitalize="characters" placeholder="ABCD"><button class="bigbtn" id="go">Next →</button></div>`;
    $("#go").onclick = () => { const c = $("#code").value.toUpperCase().replace(/[^A-Z0-9]/g, ""); if (c.length < 4) return toast("Enter the 4-letter code"); const u = new URL(location.href); u.searchParams.set("room", c); location.href = u.toString(); };
  }
  function renderJoin() {
    const captain = view.mode === "captain";
    const p = profile() || {};
    app().innerHTML = `${hdr()}<h1 class="title-glow">🎂 ${esc(view.title)}</h1>
      <div class="card"><label><b>${captain ? "Team name" : "Your name"}</b></label>
      <input class="big" id="name" maxlength="18" placeholder="${captain ? "e.g. The Pharaohs" : "e.g. Sara"}" value="${esc(p.name || "")}" autocomplete="off">
      <div style="margin-top:14px"><b>Pick your emoji</b></div>
      <div class="emojis">${EMOJIS.map((e) => `<button class="${e === pickedEmoji ? "sel" : ""}" data-e="${e}">${e}</button>`).join("")}</div>
      <button class="bigbtn" id="join">Let's go! 🚀</button></div>`;
    document.querySelectorAll("[data-e]").forEach((b) => (b.onclick = () => { pickedEmoji = b.dataset.e; document.querySelectorAll("[data-e]").forEach((x) => x.classList.toggle("sel", x === b)); }));
    $("#join").onclick = () => {
      const name = $("#name").value.trim(); if (!name) return toast("Type a name first");
      S.unlock(); keepAwake();
      store.setItem(profKey(), JSON.stringify({ name, emoji: pickedEmoji }));
      hello();
      $("#join").disabled = true; $("#join").textContent = "Joining…";
    };
  }
  function renderPickTeam() {
    app().innerHTML = `${hdr()}<h1>👥 Pick your team</h1>
      <div class="teams">${(view.teams || []).map((t) => `<button data-t="${esc(t)}">👥 ${esc(t)}</button>`).join("") || `<div class="muted">No teams yet — create the first one!</div>`}</div>
      <div class="card" style="margin-top:14px"><label><b>…or start a new team</b></label><input class="big" id="tname" maxlength="20" placeholder="Team name"><button class="bigbtn" id="tnew">Create team</button></div>
      <div class="muted center" style="margin-top:12px">The host can also shuffle everyone into teams.</div>${footer()}`;
    const choose = (t) => { const p = profile() || {}; p.team = t; store.setItem(profKey(), JSON.stringify(p)); send({ t: "team", team: t }); };
    document.querySelectorAll("[data-t]").forEach((b) => (b.onclick = () => choose(b.dataset.t)));
    $("#tnew").onclick = () => { const t = $("#tname").value.trim(); if (t) choose(t); };
  }
  function stateScreen(em, big, sub, extra) {
    return `${hdr()}<div class="state"><div class="em pop">${em}</div><div class="big">${big}</div><div class="muted">${sub || ""}</div>${extra || ""}</div>${footer()}`;
  }
  function renderQuestion() {
    const q = view.q, mine = view.myAnswer;
    app().innerHTML = `${hdr()}
      <div class="row"><span class="pill">Q ${q.n}/${q.of}</span>${view.multiplier > 1 ? `<span class="mult">×${view.multiplier}</span>` : ""}<span class="grow"></span><b id="psec"></b></div>
      <div class="qsmall" style="margin-top:10px">${esc(q.text)}</div>
      ${q.hasImage ? `<div class="lookup">📺 Look at the TV for the picture!</div>` : ""}
      <div class="ptimer"><div id="pbar" style="width:100%"></div></div>
      <div class="ansgrid">${q.options.map((o, i) => `<button class="ans ${OPT[i]} ${mine != null ? (mine === i ? "picked" : "faded") : ""}" data-i="${i}" ${mine != null ? "disabled" : ""}><span class="shape">${SHAPES[i]}</span><span>${esc(o)}</span></button>`).join("")}</div>
      ${mine != null ? `<div class="center" style="margin-top:12px;font-weight:800">🔒 Locked in! Waiting for the others…</div>` : ""}${footer()}`;
    document.querySelectorAll(".ans").forEach((b) => (b.onclick = () => {
      if (view.myAnswer != null) return;
      const i = +b.dataset.i; view.myAnswer = i;
      send({ t: "answer", choice: i });
      if (navigator.vibrate) navigator.vibrate(30);
      lastKey = ""; render();
    }));
  }
  function renderReveal() {
    const r = view.result;
    if (!r) return (app().innerHTML = stateScreen("👀", "Answer revealed", "Look at the TV!"));
    const cls = r.none ? "res-none" : r.correct ? "res-ok" : "res-bad";
    const big = r.none ? "⏰ Too slow!" : r.correct ? "✅ Correct!" : "❌ Not quite";
    app().innerHTML = `${hdr()}<div class="state"><div class="resultcard ${cls} pop">
      <div style="font-size:34px;font-weight:900">${big}</div>
      ${r.correct ? `<div style="font-size:40px;font-weight:900;margin-top:6px">+${r.points}</div>` : `<div style="margin-top:10px">Answer: <b>${esc(view.correctText)}</b></div>`}
      ${r.streak >= 2 ? `<div style="margin-top:10px;font-size:22px">🔥 ${r.streak} in a row!</div>` : ""}
      </div><div class="muted" style="margin-top:10px">${view.me.rank ? `You're <b>#${view.me.rank}</b> of ${view.me.of}` : ""}</div></div>${footer()}`;
  }
  function render() {
    if (!view) return;
    const v = view;
    const key = [v.phase, v.round && v.round.n, v.q && v.q.n, v.myAnswer, v.paused, v.me && v.me.score, v.me && v.me.rank, v.jokerAvailable, v.jokerActive, (v.teams || []).join(), v.playerCount, v.me && v.me.team].join("|");
    if (key === lastKey) return; lastKey = key;
    if (v.phase !== lastPhase) {
      if (v.phase === "reveal" && v.result && !v.result.none) { (v.result.correct ? S.correct : S.wrong)(); if (navigator.vibrate) navigator.vibrate(v.result.correct ? [40, 40, 40] : 200); }
      if (v.phase === "final" && v.isWinner) { confetti(8000); S.fanfare(); }
      lastPhase = v.phase;
    }
    switch (v.phase) {
      case "join": return renderJoin();
      case "pickTeam": return renderPickTeam();
      case "lobby": app().innerHTML = stateScreen(v.me.emoji, "You're in!", `${v.playerCount} joined so far. Watch the TV — the quiz starts soon.`); break;
      case "roundIntro": {
        const r = v.round;
        const jk = v.jokerActive ? `<div class="pill" style="font-size:20px;background:var(--gold);color:#3a1a00">🃏 Joker active — double points!</div>`
          : v.jokerAvailable ? `<button class="jokerbtn pop" id="jk">🃏 Play Joker (×2 this round)</button><div class="muted">You only get one per game${v.mode === "teams" ? " (per team)" : ""}.</div>`
          : r.double ? `<div class="pill" style="font-size:20px">✖️2 Double points round!</div>` : v.jokerUsed ? `<div class="muted">Joker already used</div>` : "";
        app().innerHTML = stateScreen("🎬", `Round ${r.n}: ${esc(r.title)}`, `${r.count} questions`, jk);
        if ($("#jk")) $("#jk").onclick = () => { send({ t: "joker" }); S.joker(); $("#jk").disabled = true; };
        break;
      }
      case "question": renderQuestion(); break;
      case "reveal": renderReveal(); break;
      case "leaderboard": app().innerHTML = stateScreen("🏆", v.me.rank ? `You're #${v.me.rank} of ${v.me.of}` : "Leaderboard", `${(v.me.score || 0).toLocaleString()} points${v.mode === "teams" ? " (team average)" : ""}. Check the TV!`); break;
      case "final": app().innerHTML = stateScreen(v.isWinner ? "🏆" : v.me.rank <= 3 ? "🎉" : "👏", v.isWinner ? "WINNER!" : `You finished #${v.me.rank}`, `${(v.me.score || 0).toLocaleString()} points. Thanks for playing! 🎂`); break;
    }
    if (v.paused) overlay("⏸ Paused", "The host paused the game"); else if ($("#ov") && connected) overlay(null);
  }
  function frame() {
    requestAnimationFrame(frame);
    if (!view || view.phase !== "question") return;
    const left = view.paused ? view.endsIn : Math.max(0, deadline - Date.now());
    const b = $("#pbar"), s = $("#psec");
    if (b) b.style.width = (100 * left / (view.timer * 1000)) + "%";
    if (s) s.textContent = Math.ceil(left / 1000) + "s";
  }
  requestAnimationFrame(frame);
  start();
})();

</script>
