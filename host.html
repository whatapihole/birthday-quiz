<!doctype html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Quiz Host 🎂</title><style>
:root {
  --bg1: #1b0b3a; --bg2: #3a0f5c; --bg3: #0d2a5c;
  --gold: #ffcc4d; --pink: #ff5fa2; --text: #fff; --muted: #c9bde6; --card: rgba(255,255,255,.08); --line: rgba(255,255,255,.15);
  --a: #e5484d; --b: #2f80ed; --c: #f2a900; --d: #27ae60;
  --ok: #2ecc71; --bad: #ff5c5c;
  font-family: ui-rounded, "SF Pro Rounded", "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; color: var(--text); }
body {
  background: radial-gradient(circle at 15% 10%, #6b1f8f 0%, transparent 40%), radial-gradient(circle at 90% 90%, #123f8a 0%, transparent 45%), linear-gradient(135deg, var(--bg1), var(--bg2) 50%, var(--bg3));
  background-attachment: fixed; min-height: 100vh;
}
button { font: inherit; cursor: pointer; border: 0; border-radius: 14px; padding: .7em 1.2em; font-weight: 700; color: #fff; background: var(--pink); transition: transform .08s, filter .15s; touch-action: manipulation; -webkit-tap-highlight-color: transparent; }
button:active { transform: scale(.97); }
button:hover { filter: brightness(1.08); }
button.secondary { background: var(--card); border: 1px solid var(--line); }
button.gold { background: var(--gold); color: #3a1a00; }
button:disabled { opacity: .45; cursor: not-allowed; }
input, select { font: inherit; padding: .6em .8em; border-radius: 12px; border: 1px solid var(--line); background: rgba(0,0,0,.25); color: #fff; }
select option { color: #000; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 22px; padding: 22px; backdrop-filter: blur(6px); }
.muted { color: var(--muted); }
.hidden { display: none !important; }
.center { text-align: center; }
.row { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.grow { flex: 1; }
.title-glow { background: linear-gradient(90deg, var(--gold), #fff3c4, var(--pink)); -webkit-background-clip: text; background-clip: text; color: transparent; font-weight: 900; letter-spacing: -.5px; }
.pill { display: inline-block; padding: .25em .8em; border-radius: 999px; background: var(--card); border: 1px solid var(--line); font-weight: 700; font-size: .9em; }
.diff-easy { color: #7dffb0; } .diff-medium { color: #ffe27a; } .diff-hard { color: #ff8a8a; }
.optA { background: var(--a); } .optB { background: var(--b); } .optC { background: var(--c); } .optD { background: var(--d); }
.shape { display: inline-flex; width: 1.6em; justify-content: center; opacity: .9; }
#confetti { position: fixed; inset: 0; pointer-events: none; z-index: 50; }
.overlay { position: fixed; inset: 0; background: rgba(10,0,30,.75); display: flex; align-items: center; justify-content: center; z-index: 40; text-align: center; padding: 20px; }
.overlay .big { font-size: 2.2em; font-weight: 900; }
.toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: rgba(0,0,0,.7); padding: .6em 1.2em; border-radius: 999px; z-index: 60; font-weight: 700; }
@keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: scale(1); opacity: 1; } }
@keyframes rise { from { transform: translateY(30px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes pulse { 50% { transform: scale(1.06); } }
.pop { animation: pop .35s ease-out both; }
.rise { animation: rise .45s ease-out both; }

/* ================= HOST / TV ================= */
body.host { overflow: hidden; height: 100vh; }
.host #stage { position: absolute; inset: 0; padding: 3vh 4vw 9vh; display: flex; flex-direction: column; }
.host .topbar { display: flex; justify-content: space-between; align-items: center; font-size: 2.2vh; gap: 2vw; }
.host .topbar .code { font-weight: 900; letter-spacing: .15em; color: var(--gold); }
.host h1 { font-size: 6vh; margin: 1vh 0; }
.host .qtext { font-size: 5vh; font-weight: 800; line-height: 1.2; text-align: center; margin: 2vh auto; max-width: 85vw; }
.host .qbody { flex: 1; display: flex; flex-direction: column; justify-content: center; min-height: 0; }
.host .qimgwrap { flex: 1; min-height: 0; display: flex; justify-content: center; align-items: center; margin-bottom: 2vh; overflow: hidden; border-radius: 20px; }
.host .qimgwrap img { max-height: 100%; max-width: 100%; border-radius: 20px; object-fit: contain; }
.host .qimgwrap.st-card img { height: 100%; width: auto; aspect-ratio: auto; background: #fff; padding: 5vh; border-radius: 3vh; box-shadow: 0 1vh 4vh rgba(0,0,0,.35); }
.host .qimgwrap.st-card { overflow: hidden; }
.host .qimgwrap.st-flag img { height: 100%; border-radius: 1vh; box-shadow: 0 1vh 4vh rgba(0,0,0,.45); }
.fx-blur img { animation: unblur var(--dur, 30s) ease-out forwards; }
.fx-zoom img { animation: unzoom var(--dur, 30s) cubic-bezier(.3,0,.2,1) forwards; }
.fx-paused img { animation-play-state: paused !important; }
@keyframes unblur { from { filter: blur(25px) saturate(1.4); } to { filter: blur(0); } }
@keyframes unzoom { from { transform: scale(7); } to { transform: scale(1); } }
.host .opts { display: grid; grid-template-columns: 1fr 1fr; gap: 1.6vh 1.6vw; }
.host .opt { border-radius: 2vh; padding: 2.2vh 2vw; font-size: 3.4vh; font-weight: 800; display: flex; align-items: center; gap: 1vw; position: relative; overflow: hidden; transition: opacity .4s, transform .4s; min-height: 10vh; }
.host .opt .cnt { margin-left: auto; font-size: 3vh; background: rgba(0,0,0,.25); border-radius: 999px; padding: .1em .7em; }
.host .opt .bar { position: absolute; left: 0; bottom: 0; height: .9vh; background: rgba(255,255,255,.75); transition: width .8s ease-out; }
.host .opt.dim { opacity: .28; transform: scale(.97); }
.host .opt.win { box-shadow: 0 0 0 .6vh #fff, 0 0 4vh rgba(255,255,255,.6); animation: pulse 1s ease-in-out 2; }
.host .timer { display: flex; align-items: center; gap: 2vw; margin: 2vh 0 0; }
.host .tbar { flex: 1; height: 1.6vh; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; }
.host .tbar > div { height: 100%; background: linear-gradient(90deg, var(--ok), var(--gold), var(--bad)); background-size: 300% 100%; border-radius: 999px; }
.host .tnum { font-size: 5vh; font-weight: 900; width: 9vh; text-align: center; }
.host .answered { font-size: 2.6vh; }
.host .fact { margin-top: 2vh; font-size: 3vh; text-align: center; background: rgba(255,204,77,.12); border: 1px solid rgba(255,204,77,.4); border-radius: 2vh; padding: 1.4vh 2vw; }
.host .bottomline { display: flex; justify-content: space-between; gap: 2vw; font-size: 2.6vh; margin-top: 1.5vh; flex-wrap: wrap; }
.host .controls { position: fixed; left: 0; right: 0; bottom: 0; display: flex; gap: 8px; justify-content: center; align-items: center; padding: 1vh; background: rgba(0,0,0,.35); font-size: 1.7vh; opacity: .35; transition: opacity .2s; z-index: 30; }
.host .controls:hover { opacity: 1; }
.host .controls button { padding: .5em .9em; font-size: 1.7vh; }
.host .status { position: fixed; top: 8px; right: 12px; font-size: 1.5vh; z-index: 31; }
.dot { display: inline-block; width: .7em; height: .7em; border-radius: 50%; background: var(--bad); margin-right: .3em; vertical-align: middle; }
.dot.ok { background: var(--ok); }

/* lobby */
.host .lobby { flex: 1; display: grid; grid-template-columns: 34vw 1fr; gap: 3vw; min-height: 0; }
.host .qrbox { background: #fff; border-radius: 3vh; padding: 3vh; display: flex; flex-direction: column; align-items: center; color: #1b0b3a; }
.host .qrbox #qr img, .host .qrbox #qr canvas { width: 26vw !important; height: 26vw !important; max-height: 50vh; max-width: 50vh; }
.host .qrbox .url { font-size: 1.8vh; word-break: break-all; text-align: center; margin-top: 1.5vh; }
.host .qrbox .bigcode { font-size: 5vh; font-weight: 900; letter-spacing: .2em; }
.host .plist { display: flex; flex-wrap: wrap; gap: 1.2vh; align-content: flex-start; overflow: auto; }
.host .ptile { background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: .5vh 1.4vw .5vh .6vw; font-size: 2.8vh; font-weight: 800; animation: pop .35s both; cursor: pointer; }
.host .ptile.off { opacity: .4; }
.host .teamcol { background: var(--card); border: 1px solid var(--line); border-radius: 2vh; padding: 1.5vh 1.2vw; min-width: 18vw; }
.host .teamcol h3 { margin: 0 0 1vh; font-size: 3vh; color: var(--gold); }
.host .teamcol .m { font-size: 2.4vh; margin: .4vh 0; cursor: pointer; }

/* intro, board, final */
.host .bigcenter { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; }
.host .roundno { font-size: 4vh; color: var(--muted); font-weight: 800; letter-spacing: .3em; text-transform: uppercase; }
.host .roundtitle { font-size: 12vh; margin: 1vh 0; }
.host .board { width: min(80vw, 120vh); margin: 0 auto; display: flex; flex-direction: column; gap: 1.1vh; }
.host .brow { display: grid; grid-template-columns: 7vh 1fr auto; align-items: center; gap: 1.5vw; background: var(--card); border: 1px solid var(--line); border-radius: 1.6vh; padding: 1.1vh 1.5vw; font-size: 3.2vh; font-weight: 800; position: relative; overflow: hidden; }
.host .brow .fill { position: absolute; inset: 0 auto 0 0; background: linear-gradient(90deg, rgba(255,95,162,.35), rgba(255,204,77,.25)); z-index: -1; transition: width 1.2s ease-out; }
.host .brow .rk { font-size: 3.6vh; text-align: center; }
.host .brow .sub { font-size: 1.9vh; color: var(--muted); font-weight: 600; }
.host .podium { display: flex; align-items: flex-end; justify-content: center; gap: 2vw; margin-top: 3vh; }
.host .pod { width: 22vw; text-align: center; }
.host .pod .blk { border-radius: 2vh 2vh 0 0; display: flex; align-items: flex-start; justify-content: center; padding-top: 2vh; font-size: 8vh; font-weight: 900; }
.host .pod .who { font-size: 3.4vh; font-weight: 900; margin-bottom: 1vh; }
.host .pod .pts { font-size: 2.6vh; color: var(--gold); }
.host .p1 .blk { height: 30vh; background: linear-gradient(#ffd86b, #e0a100); color: #5a3a00; }
.host .p2 .blk { height: 22vh; background: linear-gradient(#e9eef5, #9aa7b8); color: #2c3440; }
.host .p3 .blk { height: 16vh; background: linear-gradient(#f0b27a, #b86b2d); color: #4a2400; }
.host .awards { display: flex; gap: 2vw; justify-content: center; margin-top: 3vh; flex-wrap: wrap; }
.host .award { background: var(--card); border: 1px solid var(--line); border-radius: 2vh; padding: 1.5vh 2vw; text-align: center; font-size: 2.4vh; }
.host .award .ic { font-size: 5vh; }

/* setup screen (scrollable) */
body.host.setup { overflow: auto; height: auto; }
.setupwrap { max-width: 900px; margin: 30px auto; padding: 0 20px 60px; }
.setupwrap h1 { font-size: 40px; margin: 0 0 6px; }
.setupwrap label { display: block; font-weight: 700; margin: 14px 0 6px; }
.setupwrap .modes { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.setupwrap .mode { border: 2px solid var(--line); border-radius: 16px; padding: 14px; cursor: pointer; background: var(--card); }
.setupwrap .mode.sel { border-color: var(--gold); background: rgba(255,204,77,.12); }
.setupwrap .mode b { display: block; font-size: 18px; margin-bottom: 4px; }
.setupwrap .roundrow { display: grid; grid-template-columns: 90px 1fr 140px 44px; gap: 10px; align-items: center; margin-bottom: 8px; }
.setupwrap .toggles label { display: flex; gap: 10px; align-items: center; font-weight: 600; margin: 8px 0; }
.setupwrap .toggles input[type=checkbox] { width: 20px; height: 20px; }
.setupwrap .sec { margin-top: 18px; }
.progress { height: 10px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; margin: 10px 0; }
.progress > div { height: 100%; background: var(--gold); width: 0; transition: width .2s; }
.modal { position: fixed; inset: 0; background: rgba(0,0,0,.6); z-index: 45; display: flex; align-items: center; justify-content: center; }
.modal .card { width: min(720px, 92vw); max-height: 85vh; overflow: auto; background: #2a1150; }
.modal .brow2 { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.modal .brow2 .n { flex: 1; font-weight: 700; }
.modal .brow2 button { padding: .35em .7em; }
.kbd { display: inline-block; border: 1px solid var(--line); border-bottom-width: 3px; border-radius: 6px; padding: 0 .4em; font-size: .85em; }

/* ================= PLAYER / PHONE ================= */
body.player { min-height: 100dvh; }
.player #app { max-width: 520px; margin: 0 auto; padding: 16px 16px 90px; min-height: 100dvh; display: flex; flex-direction: column; }
.player .hdr { display: flex; justify-content: space-between; align-items: center; font-size: 14px; margin-bottom: 10px; }
.player h1 { font-size: 28px; margin: 6px 0 14px; }
.player .emojis { display: grid; grid-template-columns: repeat(6, 1fr); gap: 8px; margin: 10px 0 16px; }
.player .emojis button { font-size: 26px; padding: 8px 0; background: var(--card); border: 2px solid transparent; }
.player .emojis button.sel { border-color: var(--gold); background: rgba(255,204,77,.2); }
.player input.big { width: 100%; font-size: 20px; padding: 14px; }
.player .bigbtn { width: 100%; font-size: 22px; padding: 16px; margin-top: 12px; }
.player .teams button { width: 100%; margin: 6px 0; font-size: 20px; background: var(--card); border: 1px solid var(--line); text-align: left; }
.player .ansgrid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; gap: 12px; margin-top: 12px; min-height: 55dvh; }
.player .ans { font-size: 18px; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; padding: 10px; text-align: center; line-height: 1.2; }
.player .ans .shape { font-size: 30px; width: auto; }
.player .ans.picked { box-shadow: 0 0 0 5px #fff; }
.player .ans.faded { opacity: .25; }
.player .ans:disabled { opacity: 1; cursor: default; } .player .ans.faded:disabled { opacity: .25; }
.player .qsmall { font-size: 17px; font-weight: 700; line-height: 1.3; }
.player .ptimer { height: 8px; background: rgba(255,255,255,.12); border-radius: 999px; overflow: hidden; margin-top: 10px; }
.player .ptimer > div { height: 100%; background: var(--gold); }
.player .state { flex: 1; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; gap: 10px; }
.player .state .em { font-size: 72px; }
.player .state .big { font-size: 30px; font-weight: 900; }
.player .res-ok { background: linear-gradient(160deg, #1e9e57, #0f6b3a); }
.player .res-bad { background: linear-gradient(160deg, #c0392b, #7d1f16); }
.player .res-none { background: linear-gradient(160deg, #555, #333); }
.player .resultcard { border-radius: 24px; padding: 28px 18px; width: 100%; }
.player .footer { position: fixed; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,.4); padding: 12px 16px calc(12px + env(safe-area-inset-bottom)); display: flex; justify-content: space-between; font-weight: 800; font-size: 16px; }
.player .jokerbtn { font-size: 24px; padding: 18px 26px; background: linear-gradient(90deg, #ff5fa2, #ffcc4d); color: #2a0a2a; }
.player .mult { display: inline-block; background: var(--gold); color: #3a1a00; border-radius: 999px; padding: 2px 10px; font-weight: 900; margin-left: 6px; }
.player .lookup { margin-top: 8px; font-weight: 800; color: var(--gold); }

/* landing */
.landing { max-width: 560px; margin: 0 auto; padding: 40px 20px; text-align: center; }
.landing .card { margin-top: 20px; text-align: left; }

</style>

/* ===== engine.js ===== */
/* Game engine: pure logic, no DOM, no networking. Works in browser and Node (for tests). */
(function (root) {
  const DIFF = { easy: 0, medium: 1, hard: 2 };
  const TEAM_NAMES = ["Quiz Khalifas", "Brainy Bunch", "Smarty Pants", "Know-It-Alls", "Trivia Titans", "Cake Crusaders", "The Pharaohs", "Nile Nerds"];

  function shuffle(a, rnd) {
    a = a.slice();
    for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(rnd() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; }
    return a;
  }

  /* specs: [{category:"Mixed"|<name>, count:n}] ; used: Set of ids played in earlier games */
  function buildRounds(bank, specs, used, rnd) {
    rnd = rnd || Math.random; used = used || new Set();
    const taken = new Set();
    const order = (list) => {
      const s = shuffle(list, rnd);
      return s.filter((q) => !used.has(q.id)).concat(s.filter((q) => used.has(q.id)));
    };
    const rounds = [];
    for (const spec of specs) {
      // A round draws only from the categories ticked in setup (spec.categories).
      // Older saved rounds used a single category name or "Mixed"; both still work.
      const sel = Array.isArray(spec.categories) && spec.categories.length ? spec.categories
        : (spec.category && spec.category !== "Mixed" ? [spec.category] : null);
      const avail = bank.filter((q) => !taken.has(q.id) && (!sel || sel.includes(q.category)));
      const groups = {};
      order(avail).forEach((q) => (groups[q.category] = groups[q.category] || []).push(q));
      const cats = shuffle(Object.keys(groups), rnd);
      let picked = [], i = 0;
      // Round-robin across the chosen categories so each one gets a fair share.
      while (picked.length < spec.count && cats.some((c) => groups[c].length)) {
        const c = cats[i++ % cats.length];
        if (groups[c].length) picked.push(groups[c].shift());
      }
      picked.forEach((q) => taken.add(q.id));
      picked = shuffle(picked, rnd).sort((x, y) => (DIFF[x.difficulty] ?? 1) - (DIFF[y.difficulty] ?? 1));
      const title = sel ? (sel.length === 1 ? sel[0] : sel.length <= 3 ? sel.join(" · ") : "Mixed Bag") : "Mixed Bag";
      rounds.push({ title, category: sel && sel.length === 1 ? sel[0] : "Mixed", questions: picked.map((q) => Object.assign({}, q)) });
    }
    return rounds;
  }

  class QuizEngine {
    constructor(settings, rounds) {
      this.s = Object.assign({
        title: "Quiz Night", mode: "solo", timer: 30, autopilot: true, doubleFinal: true, jokers: true,
        revealSecs: 10, introSecs: 10, boardSecs: 12
      }, settings || {});
      if (this.s.doubleFinal && rounds && rounds.length) rounds[rounds.length - 1].double = true;
      this.rounds = rounds || [];
      this.phase = "lobby";
      this.r = -1; this.q = -1;
      this.players = {};
      this.teams = {};
      this.answers = {};
      this.qStart = 0; this.deadline = 0; this.phaseEnds = 0;
      this.paused = false; this.pauseLeft = null; this.pausePhaseLeft = null;
      this.lastReveal = null;
      this.version = 0;
    }

    get teamMode() { return this.s.mode === "teams"; }
    round() { return this.rounds[this.r]; }
    question() { const r = this.round(); return r && r.questions[this.q]; }
    totalQuestions() { return this.rounds.reduce((n, r) => n + r.questions.length, 0); }
    touch() { this.version++; }
    playerList() { return Object.values(this.players); }
    eligible(now) { return this.playerList().filter((p) => p.connected && (!this.teamMode || p.team)); }

    join(pid, info, now) {
      let p = this.players[pid];
      if (!p) {
        let name = String(info.name || "Player").trim().slice(0, 18) || "Player";
        const taken = new Set(this.playerList().map((x) => x.name.toLowerCase()));
        let n = 2, base = name;
        while (taken.has(name.toLowerCase())) name = base + " " + n++;
        p = this.players[pid] = {
          pid, name, emoji: info.emoji || "🙂", team: null, score: 0, bonus: 0, streak: 0, bestStreak: 0,
          correct: 0, correctMs: 0, jokerRound: null, last: null, connected: true, lastSeen: now || 0, joinedAt: now || 0
        };
        if (this.teamMode && info.team) this.setTeam(pid, info.team);
      }
      p.connected = true; p.lastSeen = now || p.lastSeen;
      this.touch();
      return p;
    }
    setTeam(pid, teamName) {
      const p = this.players[pid]; if (!p || !this.teamMode) return;
      teamName = String(teamName || "").trim().slice(0, 20);
      if (!teamName) return;
      const existing = Object.keys(this.teams).find((t) => t.toLowerCase() === teamName.toLowerCase());
      const name = existing || teamName;
      if (!this.teams[name]) this.teams[name] = { name, bonus: 0, jokerRound: null };
      p.team = name;
      this.pruneTeams();
      this.touch();
    }
    pruneTeams() {
      const used = new Set(this.playerList().map((p) => p.team));
      for (const t of Object.keys(this.teams)) if (!used.has(t) && this.phase === "lobby") delete this.teams[t];
    }
    shuffleTeams(count, rnd) {
      rnd = rnd || Math.random;
      const ps = shuffle(this.playerList(), rnd);
      count = Math.max(2, Math.min(count || 2, ps.length || 2));
      const names = shuffle(TEAM_NAMES, rnd).slice(0, count);
      this.teams = {};
      names.forEach((n) => (this.teams[n] = { name: n, bonus: 0, jokerRound: null }));
      ps.forEach((p, i) => (p.team = names[i % count]));
      this.touch();
    }
    remove(pid) { delete this.players[pid]; this.pruneTeams(); this.touch(); }
    setConnected(pid, on, now) { const p = this.players[pid]; if (p) { p.connected = on; if (on) p.lastSeen = now; this.touch(); } }
    seen(pid, now) { const p = this.players[pid]; if (p) { p.lastSeen = now; if (!p.connected) { p.connected = true; this.touch(); } } }
    staleCheck(now, ms) {
      for (const p of this.playerList()) if (p.connected && now - p.lastSeen > ms) { p.connected = false; this.touch(); }
    }

    start(now) {
      if (this.phase !== "lobby" || !this.rounds.length) return false;
      this.pruneTeams();
      this.startRound(0, now);
      return true;
    }
    startRound(r, now) {
      this.r = r; this.q = -1; this.phase = "roundIntro";
      this.phaseEnds = now + this.s.introSecs * 1000; this.touch();
    }
    startQuestion(q, now) {
      this.q = q; this.phase = "question"; this.answers = {};

      switch (this.phase) {

        case "roundIntro": this.startQuestion(0, now); break;

          break;

      }
      return true;
    }
    finish() { this.phase = "final"; this.paused = false; this.phaseEnds = 0; this.touch(); }

        const all = el.length > 0 && el.every((p) => this.answers[p.pid]);

    }

      this.pausePhaseLeft = this.phaseEnds ? Math.max(0, this.phaseEnds - now) : null;

      this.paused = false;

      this.pauseLeft = this.pausePhaseLeft = null; this.touch();
    }

      const p = this.players[pid]; if (!p) return false;

      this.answers[pid] = { choice, ms: Math.max(0, now - this.qStart) };

    }

      return m;
    }

  function withTimeout(p, ms) { return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), ms))]); }
  function loadImg(url) {
    return withTimeout(new Promise((res, rej) => { const im = new Image(); im.onload = () => res(url); im.onerror = () => rej(new Error("img")); im.src = url; }), 8000);
  }
  async function candidateUrl(c) {
    c = c.trim();
    if (c.startsWith("flag:")) return "https://flagcdn.com/w1280/" + c.slice(5).trim().toLowerCase() + ".png";
    if (c.startsWith("si:")) return "https://cdn.simpleicons.org/" + encodeURIComponent(c.slice(3).trim());
    if (c.startsWith("wiki:")) {
      const title = c.slice(5).trim();
      const api = "https://en.wikipedia.org/w/api.php?action=query&format=json&origin=*&redirects=1&prop=pageimages&piprop=thumbnail&pithumbsize=900&titles=" + encodeURIComponent(title);
      const r = await withTimeout(fetch(api), 8000);
      const j = await r.json();
      const pages = (j.query && j.query.pages) || {};
      const pg = Object.values(pages)[0];
      if (!pg || !pg.thumbnail) throw new Error("no wiki image");
      return pg.thumbnail.source;
    }
    return c;
  }
  async function resolveImage(spec) {
    if (!spec) return null;
    if (imgCache[spec]) { try { return await loadImg(imgCache[spec]); } catch (e) { delete imgCache[spec]; } }
    for (const c of spec.split("|")) {
      try { const url = await candidateUrl(c); await loadImg(url); imgCache[spec] = url; saveImgCache(); return url; } catch (e) {}
    }
    return null;
  }
  async function resolveQuestion(q) {
    // returns a copy with real URLs, or null if a needed picture can't load
    const o = Object.assign({}, q);
    if (q.image) { o.image = await resolveImage(q.image); if (!o.image) return null; }
    if (q.answerImage) o.answerImage = await resolveImage(q.answerImage);   // optional: no answer picture is fine
    return o;
  }
  async function pool(items, n, fn, onEach) {
    let i = 0; const out = new Array(items.length);
    await Promise.all(Array.from({ length: Math.min(n, items.length) }, async () => {
      while (i < items.length) { const k = i++; out[k] = await fn(items[k]); if (onEach) onEach(); }
    }));
    return out;
  }
  /* Resolve every picture in the chosen rounds; swap out questions whose picture fails */
  async function preparePictures(rounds, bank, progress) {
    const all = rounds.flatMap((r) => r.questions);
    const pics = all.filter((q) => q.image || q.answerImage);
    let done = 0; progress(0, pics.length);
    const usedIdsNow = new Set(all.map((q) => q.id));
    const spare = bank.filter((q) => !usedIdsNow.has(q.id));
    let replaced = 0;
    for (const r of rounds) {
      const results = await pool(r.questions, 6, (q) => (q.image || q.answerImage) ? resolveQuestion(q) : Promise.resolve(q), () => progress(++done, pics.length));
      for (let k = 0; k < r.questions.length; k++) {
        if (results[k]) { r.questions[k] = Object.assign(r.questions[k], results[k]); continue; }
        const failed = r.questions[k];
        // try a spare from the same category, then any text-only question
        let sub = null;
        const sameCat = spare.filter((q) => q.category === failed.category);
        for (const cand of sameCat) { spare.splice(spare.indexOf(cand), 1); const ok = await resolveQuestion(cand); if (ok) { sub = ok; break; } }
        if (!sub) { const t = spare.find((q) => !q.image); if (t) { spare.splice(spare.indexOf(t), 1); sub = Object.assign({}, t); } }
        if (sub) { r.questions[k] = sub; replaced++; } else { r.questions[k] = null; }
      }
      r.questions = r.questions.filter(Boolean);
    }
    return replaced;
  }

  function loadSettings() { try { return Object.assign(defaults(), JSON.parse(localStorage.getItem(LS.settings) || "{}")); } catch (e) { return defaults(); } }

    $("#addRound").onclick = () => { rounds.push({ count: 15, categories: [...cats] }); drawRounds(); };
    ["timer", "revealSecs", "introSecs", "boardSecs", "doubleFinal"].forEach((id) => $("#" + id).addEventListener("input", drawRounds));

    $("#checkPics").onclick = async () => {

  /* ---------------- GAME LIFECYCLE ---------------- */
  function newCode() { const A = "ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let c = ""; for (let i = 0; i < 4; i++) c += A[Math.floor(Math.random() * A.length)]; return c; }
  async function createGame(st) {
    const bank = getBank();
    const r = buildRounds(bank, st.rounds, st.preferUnused ? usedIds() : new Set());
    const nPics = r.flatMap((x) => x.questions).filter((q) => q.image || q.answerImage).length;
    if (nPics) {
      document.body.className = "host";
      $("#stage").innerHTML = `<div class="bigcenter"><h1 class="title-glow">🖼️ Loading pictures…</h1><div style="width:50vw" class="progress"><div id="lbar"></div></div><div class="muted" id="ltxt" style="font-size:2.4vh"></div></div>`;
      const replaced = await preparePictures(r, bank, (d, n) => { const b = $("#lbar"); if (b) b.style.width = (n ? 100 * d / n : 100) + "%"; const t = $("#ltxt"); if (t) t.textContent = `${d} / ${n}`; });
      if (replaced) toast(`${replaced} picture question${replaced > 1 ? "s" : ""} couldn't load and ${replaced > 1 ? "were" : "was"} swapped`, 5000);
    }
    engine = new QuizEngine(st, r.filter((x) => x.questions.length));
    room = newCode();
    localStorage.removeItem(LS.save);
    boot();
  }
  function resumeGame(save) {
    engine = QuizEngine.restore(save.engine, now());
    room = save.room;
    boot();
    toast("Game restored — paused. Players will reconnect automatically. Press Space to continue.", 5000);
  }
  async function boot() {
    document.body.className = "host";
    keepAwake();
    $("#stage").innerHTML = `<div class="bigcenter"><h1 class="title-glow">Connecting…</h1></div>`;
    installControls();
    conn2pid = {}; pid2conn = {};
    transport = await QuizTransport.createHost(room, {
      onOpen: () => {},
      onClose: (cid) => { const pid = conn2pid[cid]; delete conn2pid[cid]; if (pid && pid2conn[pid] === cid) { delete pid2conn[pid]; engine.setConnected(pid, false); } },
      onMessage: onMsg,
      onStatus: (t, ok) => { statusText = t; online = ok; drawStatus(); }
    });
    setInterval(loop, 200);
    requestAnimationFrame(frame);
    sync(true);
  }
  function persist() {
    try { localStorage.setItem(LS.save, JSON.stringify({ room, engine: engine.serialize(), savedAt: now() })); } catch (e) {}
  }

  /* ---------------- NETWORK ---------------- */
  function onMsg(cid, m) {
    if (!m || typeof m !== "object") return;
    const t = now();
    if (m.t === "hello") {
      const pid = String(m.pid || "").slice(0, 40); if (!pid) return;
      const old = pid2conn[pid]; if (old && old !== cid) delete conn2pid[old];
      conn2pid[cid] = pid; pid2conn[pid] = cid;
      if (engine.players[pid]) engine.join(pid, {}, t);
      else if (m.name) { engine.join(pid, { name: m.name, emoji: m.emoji, team: m.team }, t); }
      sendView(pid);
      return;
    }
    const pid = conn2pid[cid]; if (!pid) return;
    engine.seen(pid, t);
    switch (m.t) {
      case "ping": transport.send(cid, { t: "pong" }); break;
      case "team": engine.setTeam(pid, m.team); break;
      case "answer": engine.answer(pid, +m.choice, t); break;
      case "joker": if (engine.joker(pid)) S.joker(); break;
      case "leave": engine.remove(pid); delete pid2conn[pid]; delete conn2pid[cid]; break;
    }
  }
  function sendView(pid) {
    const cid = pid2conn[pid]; if (!cid) return;
    transport.send(cid, { t: "view", v: engine.playerView(pid, now()) });
  }
  function broadcast() { Object.keys(pid2conn).forEach(sendView); }

  /* ---------------- LOOP ---------------- */
  function loop() {
    const t = now();
    engine.staleCheck(t, 15000);
    engine.tick(t);
    sync(false);
  }
  function sync(force) {
    if (!engine) return;
    if (!force && engine.version === lastVersion) return;
    lastVersion = engine.version;
    if (transport) broadcast();
    render();
    persist();
  }

  /* ---------------- CONTROLS ---------------- */
  function installControls() {
    if ($(".controls")) return;
    const c = document.createElement("div"); c.className = "controls";
    c.innerHTML = `
      <button class="secondary" id="cPause">⏸ Pause <span class="kbd">Space</span></button>
      <button class="secondary" id="cNext">⏭ Next <span class="kbd">N</span></button>
      <button class="secondary" id="cAuto"></button>
      <button class="secondary" id="cBonus">➕ Bonus points <span class="kbd">B</span></button>
      <button class="secondary" id="cMute"></button>
      <button class="secondary" id="cFull">⛶ <span class="kbd">F</span></button>
      <button class="secondary" id="cEnd">🏁 End game</button>`;
    document.body.appendChild(c);
    const st = document.createElement("div"); st.className = "status"; document.body.appendChild(st);
    $("#cPause").onclick = togglePause; $("#cNext").onclick = () => { engine.next(now()); sync(); };
    $("#cAuto").onclick = toggleAuto; $("#cBonus").onclick = openBonus; $("#cMute").onclick = () => { S.toggleMute(); drawControls(); };
    $("#cFull").onclick = fullscreen;
    $("#cEnd").onclick = () => { if (confirm("End the game now and show the final results?")) { engine.finish(); sync(); } };
    document.addEventListener("keydown", (e) => {
      if (e.target.tagName === "INPUT" || $(".modal")) { if (e.key === "Escape" && $(".modal")) $(".modal").remove(); return; }
      const k = e.key.toLowerCase();
      if (k === " ") { e.preventDefault(); togglePause(); }
      else if (k === "n" || e.key === "ArrowRight") { engine.next(now()); sync(); }
      else if (k === "a") toggleAuto();
      else if (k === "b") openBonus();
      else if (k === "m") { S.toggleMute(); drawControls(); }
      else if (k === "f") fullscreen();
    });
    drawControls();
  }
  function drawControls() {
    if (!engine || !$("#cAuto")) return;
    $("#cPause").innerHTML = (engine.paused ? "▶ Resume" : "⏸ Pause") + ` <span class="kbd">Space</span>`;
    $("#cAuto").innerHTML = `🤖 Auto-pilot: <b>${engine.s.autopilot ? "ON" : "OFF"}</b> <span class="kbd">A</span>`;
    $("#cMute").innerHTML = (S.muted ? "🔇" : "🔊") + ` <span class="kbd">M</span>`;
  }
  function drawStatus() { const s = $(".status"); if (s) s.innerHTML = `<span class="dot ${online ? "ok" : ""}"></span>${esc(statusText)}`; }
  function togglePause() { const t = now(); engine.paused ? engine.resume(t) : engine.pause(t); sync(); }
  function toggleAuto() { engine.setAutopilot(!engine.s.autopilot, now()); sync(); toast("Auto-pilot " + (engine.s.autopilot ? "ON" : "OFF")); }
  function fullscreen() { if (!document.fullscreenElement) document.documentElement.requestFullscreen().catch(() => {}); else document.exitFullscreen(); }
  function openBonus() {
    if ($(".modal")) return;
    const m = document.createElement("div"); m.className = "modal";
    const draw = () => {
      const rows = engine.board();
      m.innerHTML = `<div class="card"><div class="row"><b style="font-size:22px">➕ Bonus / penalty points</b><span class="grow"></span><button class="secondary" id="mClose">Close (Esc)</button></div>
        <div class="muted" style="margin:6px 0 10px">For best team name, a dance-off, a funny answer… Doesn't pause the game.</div>
        ${rows.map((r) => `<div class="brow2"><span class="n">${esc(r.emoji)} ${esc(r.name)}</span><span class="muted">${r.score}</span>
          ${[-100, 100, 250, 500].map((p) => `<button class="${p < 0 ? "secondary" : ""}" data-id="${esc(r.id)}" data-p="${p}">${p > 0 ? "+" : ""}${p}</button>`).join("")}</div>`).join("") || "<div class='muted'>No players yet.</div>"}</div>`;
      m.querySelector("#mClose").onclick = () => m.remove();
    };
    m.addEventListener("click", (e) => {
      if (e.target === m) return m.remove();
      const b = e.target.closest("button[data-p]"); if (!b) return;
      engine.bonus(b.dataset.id, +b.dataset.p); S.join(); sync(); draw();
      const who = engine.players[b.dataset.id] ? engine.players[b.dataset.id].name : b.dataset.id;
      toast(`${+b.dataset.p > 0 ? "+" : ""}${b.dataset.p} → ${who}`);
    });
    draw(); document.body.appendChild(m);
  }

  /* ---------------- RENDER ---------------- */
  function joinUrl() {
    const u = new URL("play.html", location.href);
    u.search = "?room=" + room + (QuizTransport.isLocal() ? "&local=1" : "");
    return u.toString();
  }
  function header(v, extra) {
    return `<div class="topbar"><div class="title-glow" style="font-size:3vh">${esc(v.title)}</div>
      <div>${extra || ""}</div><div>Join: <span class="code">${room}</span></div></div>`;
  }
  function render() {
    drawControls(); drawStatus();
    const t = now(), v = engine.hostView(t);
    const key = [v.phase, engine.r, engine.q].join(":") + (v.phase === "lobby" ? ":" + JSON.stringify(v.players) + v.mode : "") + (["leaderboard", "final", "roundIntro"].includes(v.phase) ? ":" + JSON.stringify(v.board || v.jokersPlayed) : "");
    if (v.phase !== lastPhase) {
      if (v.phase === "roundIntro") S.whoosh();
      if (v.phase === "reveal") S.reveal();
      if (v.phase === "final") { S.fanfare(); setTimeout(() => confetti(8000), 600); }
      lastPhase = v.phase; lastJokers = 0;
    }
    if (v.phase === "lobby" && v.players.length > lastPlayers) S.join();
    lastPlayers = v.players.length;
    if (v.phase === "roundIntro" && (v.jokersPlayed || []).length > lastJokers) { lastJokers = v.jokersPlayed.length; }
    const wantClip = v.phase === "question" && v.q && v.q.audio ? engine.r + ":" + engine.q + ":" + v.q.audio : "";
    if (wantClip !== clipKey) { clipKey = wantClip; stopClip(); if (wantClip) playClip(v.q.audio); }
    if (clipKey) { if (engine.paused) { clip.pause(); } else if (clip.paused && clipActive) { clip.play().catch(() => {}); } }
    if (key !== lastKey) {
      lastKey = key;
      const st = $("#stage");
      st.innerHTML = ({ lobby: rLobby, roundIntro: rIntro, question: rQuestion, reveal: rQuestion, leaderboard: rBoard, final: rFinal }[v.phase])(v);
      if (v.phase === "lobby") bindLobby(v);
      if (v.phase === "reveal") setTimeout(() => document.querySelectorAll(".opt .bar").forEach((b) => (b.style.width = b.dataset.w)), 50);
      if (v.phase === "leaderboard" || v.phase === "final") setTimeout(() => document.querySelectorAll(".brow .fill").forEach((b) => (b.style.width = b.dataset.w)), 50);
      preloadNext();
    }
    patch(v);
  }
  function preloadNext() {
    // warm the browser cache for the next question's picture
    const r = engine.round(); if (!r) return;
    const nq = r.questions[engine.q + 1] || (engine.rounds[engine.r + 1] || { questions: [] }).questions[0];
    [nq && nq.image, nq && nq.answerImage].filter(Boolean).forEach((u) => { const im = new Image(); im.src = u; });
  }
  function patch(v) {
    let ov = $("#pauseOv");
    if (engine.paused && !ov) { ov = document.createElement("div"); ov.id = "pauseOv"; ov.className = "overlay"; ov.innerHTML = `<div><div class="big">⏸ Paused</div><div class="muted" style="font-size:2.4vh;margin-top:1vh">Press Space to continue</div></div>`; document.body.appendChild(ov); }
    if (!engine.paused && ov) ov.remove();
    const w = $(".qimgwrap"); if (w) w.classList.toggle("fx-paused", engine.paused);
    if (v.phase === "question") {
      const a = $("#answered");
      if (a) a.innerHTML = `✅ ${v.answered} / ${v.eligible} answered <span style="margin-left:1vw">${v.answeredList.map(esc).join(" ")}</span>`;
    }
  }
  function frame() {
    requestAnimationFrame(frame);
    if (!engine) return;
    const t = now();
    if (engine.phase === "question") {
      const left = engine.paused ? engine.pauseLeft : Math.max(0, engine.deadline - t);
      const T = engine.s.timer * 1000, b = $("#tbar"), n = $("#tnum");
      if (b) { b.style.width = (100 * left / T) + "%"; b.style.backgroundPosition = (100 * left / T) + "% 0"; }
      const sec = Math.ceil(left / 1000);
      if (n) n.textContent = sec;
      if (!engine.paused && sec !== lastTickSec) { lastTickSec = sec; if (sec <= 5 && sec > 0) (sec <= 3 ? S.tock : S.tick)(); }
    }
    const pl = $("#phaseLeft");
    if (pl) { const left = engine.paused ? engine.pausePhaseLeft : (engine.phaseEnds ? Math.max(0, engine.phaseEnds - t) : null); pl.textContent = engine.s.autopilot && left != null ? `Next in ${Math.ceil(left / 1000)}s` : (engine.s.autopilot ? "" : "Press N for next"); }
  }

  function rLobby(v) {
    const teams = v.mode === "teams";
    let list;
    if (teams) {
      const groups = {}; v.players.forEach((p) => (groups[p.team || "— no team yet —"] = groups[p.team || "— no team yet —"] || []).push(p));
      list = Object.entries(groups).map(([t, ps]) => `<div class="teamcol"><h3>${esc(t)}</h3>${ps.map((p) => `<div class="m" style="opacity:${p.connected ? 1 : .4}" data-pid="${esc(p.pid)}">${esc(p.emoji)} ${esc(p.name)}</div>`).join("")}</div>`).join("");
    } else list = v.players.map((p) => `<div class="ptile ${p.connected ? "" : "off"}" data-pid="${esc(p.pid)}">${esc(p.emoji)} ${esc(p.name)}</div>`).join("");
    const modeLbl = { solo: "Everyone for themselves", teams: "Teams", captain: "One phone per team" }[v.mode];
    return `${header(v, `<span class="pill">${modeLbl}</span> <span class="pill">${engine.rounds.length} rounds · ${engine.totalQuestions()} questions</span>`)}
      <div class="lobby" style="margin-top:2vh">
        <div class="qrbox"><div style="font-size:2.6vh;font-weight:800">📱 Scan to join</div><div id="qr" style="margin:2vh 0"></div>
          <div>or enter code</div><div class="bigcode">${room}</div><div class="url">${esc(joinUrl())}</div></div>
        <div style="display:flex;flex-direction:column;min-height:0">
          <h1 class="title-glow" style="font-size:7vh">🎂 ${esc(v.title)}</h1>
          <div class="muted" style="font-size:2.6vh;margin-bottom:2vh">${v.players.length} ${v.mode === "captain" ? "team" : "player"}${v.players.length === 1 ? "" : "s"} joined ${v.players.length ? "— tap a name to remove it" : "— waiting for the first one…"}</div>
          <div class="plist grow">${list}</div>
          <div class="row" style="margin-top:2vh">
            ${teams ? `<span>Shuffle into</span><input id="nTeams" type="number" min="2" max="8" value="${Math.max(2, Math.min(4, Math.round(v.players.length / 3) || 2))}" style="width:70px"><button class="secondary" id="shuffle">🔀 Shuffle teams</button>` : ""}
            <span class="grow"></span><button class="gold" id="startBtn" style="font-size:3vh;padding:1.5vh 3vw" ${v.players.length ? "" : "disabled"}>🚀 Start the quiz</button>
          </div>
        </div>
      </div>`;
  }
  function bindLobby(v) {
    const box = $("#qr");
    if (box && window.QRCode) new QRCode(box, { text: joinUrl(), width: 512, height: 512, colorDark: "#1b0b3a", correctLevel: QRCode.CorrectLevel.M });
    else if (box) box.innerHTML = `<div style="font-size:2vh">QR library didn't load — use the code below.</div>`;
    const sb = $("#startBtn"); if (sb) sb.onclick = () => {
      unlockAudio();
      if (engine.s.mode === "teams" && v.players.some((p) => !p.team) && !confirm("Some players haven't picked a team yet. Start anyway?")) return;
      if (engine.start(now())) {
        const u = usedIds(); engine.rounds.forEach((r) => r.questions.forEach((q) => u.add(q.id)));
        localStorage.setItem(LS.used, JSON.stringify([...u]));
      }
      sync();
    };
    const sh = $("#shuffle"); if (sh) sh.onclick = () => { engine.shuffleTeams(+$("#nTeams").value || 2); sync(); };
    document.querySelectorAll("[data-pid]").forEach((el) => (el.onclick = () => {
      const p = engine.players[el.dataset.pid]; if (!p) return;
      if (confirm(`Remove ${p.name}?`)) { const cid = pid2conn[p.pid]; if (cid) transport.send(cid, { t: "kicked" }); engine.remove(p.pid); sync(); }
    }));
  }
  function rIntro(v) {
    const r = v.round;
    const jk = v.jokersPlayed || [];
    return `${header(v)}<div class="bigcenter">
      <div class="roundno rise">Round ${r.n} of ${r.of}</div>
      <div class="roundtitle title-glow pop">${esc(r.title)}</div>
      <div style="font-size:3.4vh" class="rise">${r.count} questions · ${engine.s.timer}s each</div>
      ${r.double ? `<div class="pill pop" style="font-size:4vh;margin-top:3vh;background:var(--gold);color:#3a1a00">✖️2 DOUBLE POINTS ROUND</div>` : ""}
      ${engine.s.jokers && !r.double ? `<div style="font-size:3vh;margin-top:4vh">🃏 <b>Joker time!</b> Tap “Play Joker” on your phone to double ${v.mode === "teams" ? "your team's" : "your"} points this round.</div>
        <div style="font-size:2.8vh;margin-top:1.5vh;min-height:4vh">${jk.map((j) => `<span class="pill pop" style="margin:.3vh">🃏 ${esc(j)}</span>`).join(" ")}</div>` : ""}
      <div class="muted" id="phaseLeft" style="font-size:2.4vh;margin-top:3vh"></div></div>`;
  }
  function rQuestion(v) {
    const q = v.q, rev = v.phase === "reveal", r = v.round;
    const counts = rev ? v.reveal.counts : null, max = rev ? Math.max(1, ...counts) : 1;
    const img = rev && q.answerImage ? q.answerImage : q.image;
    const fx = !rev && q.image && q.imageEffect ? "fx-" + q.imageEffect : "";
    const stl = q.imageStyle && !(rev && q.answerImage) ? "st-" + q.imageStyle : "";
    const extra = `<span class="pill">Round ${r.n}/${r.of} · ${esc(r.title)}</span> <span class="pill">Q ${q.n}/${q.of}</span> <span class="pill diff-${q.difficulty}">${{ easy: "🟢 Easy", medium: "🟡 Medium", hard: "🔴 Hard" }[q.difficulty] || ""}</span>${r.double ? ` <span class="pill" style="background:var(--gold);color:#3a1a00">✖️2</span>` : ""}`;
    return `${header(v, extra)}
      <div class="qbody">
        ${!img && q.audio && !rev ? `<div class="qimgwrap" style="font-size:14vh">🎵</div><div style="text-align:center;margin-bottom:1vh"><button class="secondary" style="font-size:2.4vh" onclick="window.__replayClip()">🔊 Replay clip</button></div>` : ""}
        ${img ? `<div class="qimgwrap ${fx} ${stl}" style="--dur:${engine.s.timer}s"><img src="${esc(img)}" alt="" referrerpolicy="no-referrer"></div>` : ""}
        <div class="qtext ${rev ? "" : "rise"}" style="${img ? "font-size:4vh;margin:1vh auto" : ""}">${esc(q.text)}</div>
        <div class="opts">${q.options.map((o, i) => `
          <div class="opt ${LETTER_CLASS[i]} ${rev ? (i === q.answer ? "win" : "dim") : ""}"><span class="shape">${SHAPES[i]}</span><span>${esc(o)}</span>
            ${rev ? `<span class="cnt">${counts[i]}</span><div class="bar" style="width:0" data-w="${100 * counts[i] / max}%"></div>` : ""}</div>`).join("")}</div>
        ${rev ? `${q.fact ? `<div class="fact pop">💡 ${esc(q.fact)}</div>` : ""}
          <div class="bottomline"><span>${v.reveal.fastest ? `⚡ Fastest: <b>${esc(v.reveal.fastest.emoji)} ${esc(v.reveal.fastest.name)}</b> (${(v.reveal.fastest.ms / 1000).toFixed(1)}s)` : "😬 Nobody got it!"}</span>
          <span>${(v.streaks || []).slice(0, 4).map((s) => `🔥 ${esc(s.emoji)} ${esc(s.name)} ×${s.streak}`).join(" &nbsp; ")}</span><span class="muted" id="phaseLeft"></span></div>`
        : `<div class="timer"><div class="tnum" id="tnum">${engine.s.timer}</div><div class="tbar"><div id="tbar" style="width:100%"></div></div></div>
           <div class="answered" id="answered"></div>`}
      </div>`;
  }
  function boardRows(rows, n) {
    const top = Math.max(1, ...rows.map((r) => r.score));
    const medal = (k) => ["🥇", "🥈", "🥉"][k - 1] || k;
    return `<div class="board">${rows.slice(0, n).map((r, i) => `
      <div class="brow rise" style="animation-delay:${i * 0.08}s"><div class="fill" style="width:0" data-w="${100 * Math.max(0, r.score) / top}%"></div>
        <div class="rk">${medal(r.rank)}</div>
        <div>${esc(r.emoji)} ${esc(r.name)} ${r.streak >= 3 ? `🔥${r.streak}` : ""} ${r.members ? `<div class="sub">${r.members.map(esc).join(", ")}</div>` : ""}</div>
        <div>${r.score.toLocaleString()}</div></div>`).join("")}</div>`;
  }
  function rBoard(v) {
    const r = v.round;
    return `${header(v)}<div class="center"><div class="roundno" style="margin-top:2vh">After round ${r.n} of ${r.of}</div><h1 class="title-glow">🏆 Leaderboard</h1></div>
      <div style="display:flex;gap:3vw;justify-content:center;flex:1;min-height:0">
        <div style="flex:1">${boardRows(v.board, 8)}</div>
        ${v.topPlayers ? `<div class="card" style="width:28vw;font-size:2.6vh;align-self:flex-start"><b>⭐ Top players</b>${v.topPlayers.map((p, i) => `<div style="margin-top:1vh">${i + 1}. ${esc(p.emoji)} ${esc(p.name)} <span class="muted">${p.score.toLocaleString()}</span></div>`).join("")}</div>` : ""}
      </div>
      <div class="center muted" id="phaseLeft" style="font-size:2.4vh"></div>`;
  }
  function rFinal(v) {
    const b = v.board;
    const top = b.slice(0, 3);
    const P = (i, cls) => top[i] ? `<div class="pod ${cls} rise" style="animation-delay:${[0.6, 0.3, 0][i]}s"><div class="who">${esc(top[i].emoji)} ${esc(top[i].name)}</div><div class="pts">${top[i].score.toLocaleString()} pts</div><div class="blk">${top[i].rank}</div></div>` : `<div class="pod ${cls}"></div>`;
    return `${header(v)}<div class="center"><h1 class="title-glow" style="font-size:8vh">🎉 We have a winner! 🎉</h1></div>
      <div class="podium">${P(1, "p2")}${P(0, "p1")}${P(2, "p3")}</div>
      <div class="awards">${(v.awards || []).map((a) => `<div class="award pop"><div class="ic">${a.icon}</div><b>${a.title}</b><div>${esc(a.who)}</div><div class="muted">${esc(a.detail)}</div></div>`).join("")}</div>
      ${b.length > 3 ? `<div class="center muted" style="margin-top:2vh;font-size:2.4vh">${b.slice(3).map((r) => `${r.rank}. ${esc(r.name)} (${r.score.toLocaleString()})`).join(" · ")}</div>` : ""}
      <div class="center" style="margin-top:2vh"><button class="secondary" id="newGame" onclick="localStorage.removeItem('${LS.save}');location.reload()">🔁 New game</button></div>`;
  }

  window.addEventListener("beforeunload", (e) => { if (engine && !["lobby", "final"].includes(engine.phase)) { e.preventDefault(); e.returnValue = ""; } });
  renderSetup();
})();

</script>
</body></html>
